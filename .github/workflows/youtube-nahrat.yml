# Nahrání jazykových verzí dílu Naučných videí na YouTube.
# Spouští se samo po sloučení do main, když se změní některý youtube.json: nahraje všechno, co ještě
# nemá videoId, a naplánuje zveřejnění (v každém jazyce jedno video denně, čas v kanal.json).
# Ručně: GitHub → Actions → „Nahrát na YouTube“ → Run workflow (jde i z mobilní aplikace GitHubu).
# Údaje (název, popis, štítky, soubor) jsou v „Naučná videa/<díl>/youtube.json“, playlisty v „Naučná videa/nastroje/youtube/kanal.json“.
# Návod k nastavení: „Naučná videa/nastroje/youtube/NAVOD.md“.
name: Nahrát na YouTube

on:
  push:
    branches: [main]
    paths: ["Naučná videa/*/youtube.json"]
  workflow_dispatch:
    inputs:
      dil:
        description: "Díl – číslo nebo víc čísel oddělených mezerou (např. 09 nebo 01 02 03)"
        required: true
      jazyky:
        description: "Jazyky oddělené mezerou (cs en es hi). Prázdné = všechny dosud nenahrané. Playlisty zvolených jazyků se nakonec seřadí podle čísel dílů."
        required: false
        default: ""
      naplanovat:
        description: "Naplánovat zveřejnění (jedno video denně v každém jazyce)"
        type: boolean
        default: false
      verejne:
        description: "Zveřejnit hned (jinak se nahraje jako soukromé)"
        type: boolean
        default: false
      zkouska:
        description: "Jen zkouška – nic nenahrávat, jen zkontrolovat údaje a soubory"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: youtube-nahrat

jobs:
  nahrat:
    runs-on: ubuntu-latest
    # Tajemství YT_* patří do environmentu „youtube“ povoleného jen pro main (viz NAVOD.md) –
    # pak se k nim nedostane nic, co neprošlo sloučením.
    environment: youtube
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Zjistit díly
        id: dily
        env:
          DIL_IN: ${{ inputs.dil }}
          NAPLANOVAT_IN: ${{ inputs.naplanovat }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # po sloučení projít všechny díly – nahraje se jen to, co ještě nemá videoId
            dil=$(for f in "Naučná videa"/[0-9][0-9]-*/youtube.json; do basename "$(dirname "$f")" | cut -c1-2; done | sort -u | tr '\n' ' ')
            planovat=true
          else
            dil=$(printf '%s' "$DIL_IN" | tr -d '\r\n'); planovat="$NAPLANOVAT_IN"
          fi
          echo "Díly: $dil (plánovat: $planovat)"
          { echo "dil=$dil"; echo "planovat=$planovat"; } >> "$GITHUB_OUTPUT"

      - name: Nahrát na YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DIL: ${{ steps.dily.outputs.dil }}
          PLANOVAT: ${{ steps.dily.outputs.planovat }}
          JAZYKY: ${{ inputs.jazyky }}
          VEREJNE: ${{ inputs.verejne }}
          ZKOUSKA: ${{ inputs.zkouska }}
        run: |
          opts=()
          for j in $JAZYKY; do
            case "$j" in cs|en|es|hi) opts+=("$j") ;; *) echo "Neznámý jazyk: $j"; exit 1 ;; esac
          done
          [ "$PLANOVAT" = "true" ] && opts+=("--naplanovat")
          [ "$VEREJNE" = "true" ] && opts+=("--verejne")
          [ "$ZKOUSKA" = "true" ] && opts+=("--zkouska")
          chyba=0
          for d in $DIL; do
            case "$d" in *[!0-9a-z-]*) echo "Neplatný díl: $d"; chyba=1; continue ;; esac
            echo "::group::Díl $d"
            python3 "Naučná videa/nastroje/youtube/nahraj.py" "$d" "${opts[@]}" || chyba=1
            echo "::endgroup::"
          done
          exit $chyba

      # Zapíše ID nahraných videí do youtube.json i tehdy, když některé nahrání selže –
      # další spuštění pak už nahraná videa přeskočí.
      - name: Zapsat ID videí do repa
        if: ${{ always() && !inputs.zkouska }}
        env:
          DIL: ${{ steps.dily.outputs.dil }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Naučná videa/"*/youtube.json
          if git diff --cached --quiet; then echo "Nic nového k zapsání."; exit 0; fi
          git commit -m "YouTube: nahráno – díl $DIL"
          git push
