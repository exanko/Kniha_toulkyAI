name: Namluvit (ElevenLabs)

# Spouští se samo, když Claude ve větvi claude/upravy změní frontu úloh,
# nebo ručně (Actions → Namluvit → Run workflow, ne na main).
# Namluví texty z fronty, uloží MP3 + časy písmen a zapíše je zpátky do téže větve.
on:
  push:
    branches: [claude/upravy]
    paths: ["Naučná videa/nastroje/elevenlabs/fronta.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: namluvit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  namluvit:
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Namluvit frontu
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 "Naučná videa/nastroje/elevenlabs/namluv.py"
      - name: Zapsat nahrávky do větve
        if: ${{ always() }}
        env:
          VETEV: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Naučná videa/"
          if git diff --cached --quiet; then echo "Nic nového k zapsání."; exit 0; fi
          git commit -m "ElevenLabs: namluveno podle fronty"
          for pokus in 1 2 3; do
            git pull --rebase -q origin "$VETEV" && git push origin "HEAD:$VETEV" && exit 0
            sleep 10
          done
          exit 1
